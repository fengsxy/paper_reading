<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- MathJax -->
<script>
MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']]
  },
  options: {
    renderActions: {
      addMenu: [0, '', '']
    }
  }
};
</script>
<script type="text/javascript" async
  src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js">
</script>

<!-- Mobile scroll fix -->
<style>
/* Wrapper approach — more reliable on iOS Safari than html/body overflow-x */
html {
  overflow-x: hidden;
  overflow-y: scroll;
}

body {
  overflow-x: hidden;
  position: relative;
  width: 100%;
  -webkit-overflow-scrolling: touch;
}

/* The minimal theme's .wrapper can also cause overflow */
.wrapper, .outer, main, section, article {
  max-width: 100%;
  overflow-x: hidden;
}

/* Fix table overflow on mobile — scroll inside container */
table {
  display: block;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  max-width: 100%;
  word-break: keep-all;
}

/* Long links / URLs cause overflow on mobile */
a {
  word-break: break-word;
  overflow-wrap: break-word;
}

/* Prevent images from causing horizontal scroll */
img {
  max-width: 100%;
  height: auto;
}

/* Fix code blocks overflow */
pre {
  overflow-x: auto;
  max-width: 100%;
  -webkit-overflow-scrolling: touch;
}

code {
  word-wrap: break-word;
  overflow-wrap: break-word;
}

/* Long text in any block element */
p, li, td, th, h1, h2, h3, h4 {
  overflow-wrap: break-word;
  word-break: break-word;
}

/* Fix minimal theme mobile overflow */
@media screen and (max-width: 960px) {
  header {
    padding-right: 0 !important;
  }
  section {
    width: auto !important;
    overflow-x: hidden;
  }
}

@media screen and (max-width: 480px) {
  body {
    padding: 10px !important;
  }
  header {
    padding: 0 !important;
  }
}

/* Smooth scrolling */
@media (prefers-reduced-motion: no-preference) {
  html {
    scroll-behavior: smooth;
  }
}

/* Fix MathJax container overflow */
mjx-container {
  overflow-x: auto;
  max-width: 100%;
  display: inline-block;
}
</style>
