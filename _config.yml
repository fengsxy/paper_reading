title: Paper Reading Notes
description: Notes on Diffusion Models, LLMs, and Information Theory
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# MathJax support
markdown: kramdown
kramdown:
  math_engine: mathjax

# Exclude non-site files from Jekyll processing
exclude:
  - AGENTS.md
  - IDENTITY.md
  - SOUL.md
  - USER.md
  - TOOLS.md
  - HEARTBEAT.md
  - BOOTSTRAP.md
  - MEMORY.md
  - Gemfile
  - Gemfile.lock
  - process/
  - memory/
  - email_draft_greg.md
  - audio/
  - data/
  - podcast_index/
  - "*.json"
